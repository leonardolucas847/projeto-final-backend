[project]
name = "projeto-final"
version = "0.1.0"
description = "projeto final do curso EBAC na parte de backend"
authors = [
    {name = "Leonardo Lucas monteiro costa",email = "leonardolucas847@gmail.com"}
]
requires-python = ">=3.14"
dependencies = [
    "django (>=6.1.1,<7.0.0)",
    "pytest (>=9.1.1,<10.0.0)",
    "djangorestframework (>=3.18.1,<4.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "black (>=26.5.1,<27.0.0)",
    "flake8 (>=7.3.0,<8.0.0)"
]
