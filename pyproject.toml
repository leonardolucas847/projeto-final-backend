[tool.poetry]
name = "social-media-api"
version = "0.1.0"
description = "API de Rede Social com Django REST Framework"
authors = ["Leonardo Lucas Monteiro Costa <leonardolucas847@gmail.com>"]

[tool.poetry.dependencies]
python = "^3.12"
django = "^5.0"
djangorestframework = "*"
djangorestframework-simplejwt = "*"
drf-spectacular = "*"
pillow = "*"
python-decouple = "*"
whitenoise = "*"
gunicorn = "*"
psycopg2-binary = "*"
django-cors-headers = "*"

[tool.poetry.group.dev.dependencies]
pytest = "*"
black = "*"
flake8 = "*"
djangorestframework-stubs = "*"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"